<script>// Interactive animations for Muse
(function() {
  'use strict';

  function init() {
    // 1. Ripple effect on all interactive elements
    document.addEventListener('click', function(e) {
      var target = e.target.closest('button, a, [class*="cursor-pointer"], [class*="hover:"]');
      if (!target) return;

      // Skip if target already has a ripple processing
      if (target.dataset.rippleProcessing) return;
      target.dataset.rippleProcessing = '1';

      // Add ripple container class if not present
      if (!target.classList.contains('ripple')) {
        target.classList.add('ripple');
      }

      var rect = target.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height);
      var x = e.clientX - rect.left - size / 2;
      var y = e.clientY - rect.top - size / 2;

      var ripple = document.createElement('span');
      ripple.className = 'ripple-effect';
      ripple.style.width = size + 'px';
      ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';

      target.appendChild(ripple);

      ripple.addEventListener('animationend', function() {
        ripple.remove();
        delete target.dataset.rippleProcessing;
      });
    });

    // 2. Page enter animation
    var mainEl = document.querySelector('main > div');
    if (mainEl) {
      mainEl.classList.add('muse-page-enter');
    }

    // 3. Stagger fade-in for cards and list items
    function applyStagger() {
      var items = document.querySelectorAll(
        '[class*="grid"] > [class*="rounded-2xl"]:not(.muse-mobile-nav), ' +
        '.space-y-1 > [class*="rounded-xl"]'
      );
      items.forEach(function(item, i) {
        if (item.classList.contains('fade-up-item')) return;
        item.classList.add('fade-up-item');
        item.style.animationDelay = (i * 0.06) + 's';
      });
    }
    setTimeout(applyStagger, 400);
    setTimeout(applyStagger, 1200);

    // 4. Stat card glow on first load
    var statCards = document.querySelectorAll('[class*="rounded-2xl"].p-5.flex.flex-col.gap-4');
    statCards.forEach(function(card, i) {
      card.classList.add('stat-card-glow');
      card.style.animationDelay = (i * 0.5) + 's';
    });

    // 5. Hover lift on cards
    var cards = document.querySelectorAll(
      'main [class*="rounded-2xl"][class*="hover:border"]'
    );
    cards.forEach(function(card) {
      card.classList.add('hover-lift');
    });

    // 6. Number counter animation on visible stat numbers
    function animateCounters() {
      var statNumbers = document.querySelectorAll('.text-3xl.font-bold');
      statNumbers.forEach(function(el) {
        if (el.dataset.counted) return;
        el.dataset.counted = '1';
        el.classList.add('count-animate');
      });
    }
    setTimeout(animateCounters, 600);

    // 7. Progress bar fill on visible
    function animateProgressBars() {
      var bars = document.querySelectorAll('[class*="bg-violet-500\\/70"]');
      bars.forEach(function(bar) {
        bar.style.animation = 'none';
        bar.offsetHeight; // force reflow
        bar.style.animation = 'barFill 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
      });
    }
    setTimeout(animateProgressBars, 500);

    // 8. Reveal on scroll using IntersectionObserver
    if ('IntersectionObserver' in window) {
      var revealObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      setTimeout(function() {
        var revealItems = document.querySelectorAll('[class*="rounded-2xl"]');
        revealItems.forEach(function(item) {
          item.classList.add('reveal-on-scroll');
          revealObserver.observe(item);
        });
      }, 300);
    }

    // 9. Active tab animation helper
    var tabContainers = document.querySelectorAll('[class*="rounded-xl"].p-1.flex.gap-1, .grid.grid-cols-3.gap-2');
    tabContainers.forEach(function(container) {
      container.addEventListener('click', function(e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        // Brief pulse on selection
        btn.style.transform = 'scale(0.94)';
        setTimeout(function() {
          btn.style.transform = '';
        }, 150);
      });
    });

    // 10. Sidebar nav item hover sound effect (visual only)
    var sidebarLinks = document.querySelectorAll('aside a, aside button');
    sidebarLinks.forEach(function(link) {
      link.addEventListener('mouseenter', function() {
        link.style.transform = 'translateX(2px)';
      });
      link.addEventListener('mouseleave', function() {
        link.style.transform = '';
      });
    });
  }

  // Run on load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(init, 200);
    });
  } else {
    setTimeout(init, 200);
  }

  // Re-run on SPA navigation (for the router bypass full page loads)
  window.addEventListener('pageshow', function(e) {
    if (e.persisted) {
      // Page loaded from bfcache, re-init animations
      setTimeout(init, 100);
    }
  });
})();

<script>
// ============================================================
// Muse Live Data System v3
// Primary: Deezer API (no auth, browser-friendly)
// Secondary: Spotify via token proxy
// ============================================================
(function() {
  'use strict';

  var ARTIST_NAME = 'The Weeknd';
  var DEEZER = 'https://api.deezer.com';

  // Spotify (needs CORS proxy for token endpoint)
  var SPOTIFY_ID = 'ca391a4b1fb24e2e874c36e4cf5b3346';
  var SPOTIFY_SECRET = 'ab1cdd746dbd4f2c8b4ada7a7c5ddcec';
  var spotifyToken = null;

  // === Network helpers ===
  function get(url, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', url);
    x.timeout = 10000;
    x.onload = function() {
      if (x.status === 200) {
        try { cb(null, JSON.parse(x.responseText)); }
        catch(e) { cb(e); }
      } else { cb(new Error('HTTP ' + x.status)); }
    };
    x.onerror = function() { cb(new Error('Network error')); };
    x.ontimeout = function() { cb(new Error('Timeout')); };
    x.send();
  }

  function fmt(n) {
    if (n >= 1000000000) return (n / 1000000000).toFixed(1) + 'B';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return Math.floor(n || 0).toLocaleString();
  }

  function findText(sel, text) {
    var els = document.querySelectorAll(sel);
    for (var i = 0; i < els.length; i++) {
      if (els[i].textContent.trim().indexOf(text) > -1) return els[i];
    }
    return null;
  }

  function setText(sel, text) {
    var el = document.querySelector(sel);
    if (el) el.textContent = text;
  }

  // === Spotify token via proxy ===
  function getSpotifyToken(cb) {
    if (spotifyToken) { cb(null, spotifyToken); return; }

    var x = new XMLHttpRequest();
    x.open('POST', 'https://accounts.spotify.com/api/token');
    x.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    x.setRequestHeader('Authorization', 'Basic ' + btoa(SPOTIFY_ID + ':' + SPOTIFY_SECRET));
    x.timeout = 8000;
    x.onload = function() {
      if (x.status === 200) {
        var d = JSON.parse(x.responseText);
        spotifyToken = d.access_token;
        cb(null, spotifyToken);
      } else {
        // CORS blocked - fallback
        console.log('[Muse] Spotify token blocked by CORS, using Deezer only');
        cb(new Error('CORS'));
      }
    };
    x.onerror = function() {
      console.log('[Muse] Spotify unreachable, using Deezer only');
      cb(new Error('Network'));
    };
    x.ontimeout = function() { cb(new Error('Timeout')); };
    x.send();
  }

  function spotifyAPI(path, cb) {
    getSpotifyToken(function(err, token) {
      if (err) { cb(err); return; }
      get('https://api.spotify.com/v1/' + path + '?access_token=' + encodeURIComponent(token), cb);
    });
  }

  // === DOM updaters ===
  function updateSidebar(artist, picture) {
    // Avatar
    var avatar = document.querySelector('aside .bg-gradient-to-br');
    if (avatar && picture) {
      avatar.style.backgroundImage = 'url(' + picture + ')';
      avatar.style.backgroundSize = 'cover';
      avatar.style.backgroundPosition = 'center';
      avatar.style.boxShadow = '0 0 0 2px rgba(139,92,246,0.3)';
      avatar.innerHTML = '';
    }

    // Name
    var nameEl = document.querySelector('aside .text-sm.font-semibold');
    if (nameEl) nameEl.textContent = artist.name.substring(0, 22);

    // Stats
    var statEl = document.querySelector('aside .text-\\[11px\\]');
    if (statEl && artist.nb_fan) statEl.textContent = fmt(artist.nb_fan) + ' fans';

    // Initials
    var initEl = document.querySelector('aside .text-xs.font-bold');
    if (initEl) initEl.textContent = artist.name.substring(0, 2).toUpperCase();
  }

  function updateDashboard(artist, tracks) {
    console.log('[Muse Live] Updating with Deezer:', artist.name, tracks.length, 'tracks');

    // Header
    var h1 = document.querySelector('main h1');
    if (h1) h1.textContent = artist.name + ' · Streams Overview';

    // Welcome
    var welcome = findText('main p', 'Welcome back');
    if (welcome) welcome.textContent = 'Live · Deezer · ' + fmt(artist.nb_fan || 0) + ' fans';

    // === Stat Cards ===
    var cards = document.querySelectorAll('[class*="rounded-2xl"].p-5');

    // Card 1: Total Streams (estimate from fans × avg streams/fan)
    if (cards[0]) {
      var t = cards[0].querySelector('.text-3xl');
      var s = cards[0].querySelector('.text-sm');
      if (t) t.textContent = fmt((artist.nb_fan || 100000) * 27);
      if (s) s.innerHTML = '<span style="color:#5ee9b5;">&#9650;</span> Live estimate';
    }

    // Card 2: Monthly Listeners → fans
    if (cards[1]) {
      var t2 = cards[1].querySelector('.text-3xl');
      if (t2) t2.textContent = fmt(artist.nb_fan || 89000);
    }

    // Card 3: Album count → estimate
    if (cards[2]) {
      var t3 = cards[2].querySelector('.text-3xl');
      if (t3) t3.textContent = fmt(Math.floor((artist.nb_fan || 0) * 0.014));
    }

    // Card 4: Radio spins → estimate
    if (cards[3]) {
      var t4 = cards[3].querySelector('.text-3xl');
      if (t4) t4.textContent = fmt(Math.floor((artist.nb_fan || 0) / 50));
    }

    // === Top Tracks ===
    if (tracks.length > 0) {
      var rows = document.querySelectorAll('.space-y-1 > div[class*="rounded-xl"]');
      var maxRank = tracks[0].rank || 1;

      tracks.forEach(function(track, i) {
        if (i >= rows.length) return;
        var row = rows[i];
        var nameEl = row.querySelector('.text-sm.font-medium');
        var detailEl = row.querySelector('.text-xs.text-slate-500');
        var streamsEl = row.querySelector('.text-sm.font-semibold');
        var barEl = row.querySelector('[class*="bg-violet-500\\/70"]');
        var artEl = row.querySelector('.w-10.h-10');
        var rankEl = row.querySelector('.font-mono');

        if (nameEl) nameEl.textContent = (track.title_short || track.title).substring(0, 30);
        if (rankEl) rankEl.textContent = track.position || (i + 1);

        // Stream count (estimated from rank × fans)
        if (streamsEl) {
          var est = Math.floor((artist.nb_fan || 100000) * (12 - Math.min(i, 10)) / 2.5);
          streamsEl.textContent = fmt(est);
        }
        if (barEl) barEl.style.width = Math.max(3, (100 - i * 15)) + '%';

        // Details
        if (detailEl) {
          var dur = track.duration ? Math.floor(track.duration/60) + ':' + String(Math.floor(track.duration%60)).padStart(2,'0') : '';
          detailEl.textContent = (artist.name + ' · ' + dur).trim();
        }

        // Album art
        if (artEl && track.album && track.album.cover_small) {
          artEl.style.backgroundImage = 'url(' + track.album.cover_small + ')';
          artEl.style.backgroundSize = 'cover';
          artEl.innerHTML = '';
        }
      });

      // Title
      var topTitle = findText('main h2', 'Top Tracks');
      if (topTitle) topTitle.textContent = artist.name + ' · Top Tracks';
    }

    // === Platform breakdown ===
    var platforms = document.querySelectorAll('[class*="rounded-2xl"] .space-y-2 > div');
    var shares = [
      { name: 'Spotify', pct: 48 }, { name: 'Apple Music', pct: 24 },
      { name: 'YouTube Music', pct: 15 }, { name: 'Amazon Music', pct: 8 },
      { name: 'Tidal', pct: 5 }
    ];
    platforms.forEach(function(row, i) {
      if (i >= shares.length) return;
      var n = row.querySelector('.text-slate-400, span:first-child');
      var v = row.querySelector('.font-medium');
      if (n) n.textContent = shares[i].name;
      if (v) v.textContent = shares[i].pct + '%';
    });

    // Live indicator
    var dot = document.querySelector('.animate-pulse');
    if (dot && dot.parentElement) {
      dot.parentElement.innerHTML =
        '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#00d294;box-shadow:0 0 8px #00d294;animation:pulse 2s infinite;"></span> ' +
        '<span style="font-size:13px;color:#5ee9b5;">Live · Deezer</span>';
    }
  }

  function updateCatalogue(artist, tracks) {
    var h1 = document.querySelector('main h1');
    if (h1) h1.textContent = artist.name + ' · Music Catalogue';

    var sub = findText('main p', 'released');
    if (sub) sub.textContent = tracks.length + ' tracks · Deezer live data';

    var cards = document.querySelectorAll('main .grid > [class*="rounded-2xl"]');

    tracks.forEach(function(track, i) {
      if (i >= cards.length - 1) return;
      var card = cards[i];
      var nameEl = card.querySelector('.font-semibold');
      var genreEl = card.querySelector('.text-xs.text-slate-500');
      var artEl = card.querySelector('.w-16.h-16');
      var streamsEl = card.querySelector('.text-violet-300');
      var durBlock = card.querySelector('.grid-cols-3 > div:first-child span:last-child');
      var bpmBlock = card.querySelector('.grid-cols-3 > div:nth-child(2) span:last-child');
      var keyBlock = card.querySelector('.grid-cols-3 > div:nth-child(3) span:last-child');
      var dateEls = card.querySelectorAll('.text-slate-400');

      if (nameEl) nameEl.textContent = (track.title_short || track.title).substring(0, 25);
      if (genreEl) genreEl.textContent = artist.name;

      if (artEl && track.album && track.album.cover_medium) {
        artEl.style.backgroundImage = 'url(' + track.album.cover_medium + ')';
        artEl.style.backgroundSize = 'cover';
        artEl.innerHTML = '';
      }

      if (streamsEl) {
        var est = Math.floor((artist.nb_fan || 50000) * (10 - i) / 2);
        streamsEl.textContent = fmt(est);
      }

      if (durBlock && track.duration) {
        var d = Math.floor(track.duration);
        durBlock.textContent = Math.floor(d/60) + ':' + String(d%60).padStart(2,'0');
      }

      if (bpmBlock && track.bpm) bpmBlock.textContent = track.bpm + ' BPM';
      else if (bpmBlock) bpmBlock.textContent = track.rank ? (100 - track.rank * 5) + ' pop' : '';

      if (keyBlock) keyBlock.textContent = '';

      if (dateEls.length > 0 && track.album && track.album.release_date) {
        dateEls[dateEls.length-1].textContent = track.album.release_date;
      }
    });

    // Update "Add Track" button too
    var addBtn = document.querySelector('main .grid > button');
    if (addBtn) {
      var plusEl = addBtn.querySelector('span:last-child');
      if (plusEl) plusEl.textContent = 'Add Track (' + artist.name + ')';
    }
  }

  function updateMarketing(artist) {
    var h1 = document.querySelector('main h1');
    if (h1) h1.textContent = artist.name + ' · Marketing Plan';

    var sub = findText('main p', 'Generate');
    if (sub) sub.textContent = 'Live strategy · ' + artist.name + ' · ' + fmt(artist.nb_fan || 0) + ' fans';
  }

  function updateVisuals(artist) {
    var h1 = document.querySelector('main h1');
    if (h1) h1.textContent = artist.name + ' · Promo Visuals';

    var inputs = document.querySelectorAll('main input');
    for (var i = 0; i < inputs.length; i++) {
      if (inputs[i].type === 'text' && inputs[i].value === 'Nova Eclipse') {
        inputs[i].value = artist.name.substring(0, 22);
      }
    }

    var sub = findText('main p', 'Create artwork');
    if (sub) sub.textContent = 'Artwork generator · ' + artist.name;
  }

  // === Main ===
  function load() {
    console.log('[Muse Live] Fetching from Deezer API...');

    // Step 1: Search artist
    get(DEEZER + '/search/artist?q=' + encodeURIComponent(ARTIST_NAME), function(err, data) {
      if (err || !data.data || data.data.length === 0) {
        console.warn('[Muse Live] Artist not found:', ARTIST_NAME);
        return;
      }

      var artist = data.data[0];
      console.log('[Muse Live] Found:', artist.name, '·', fmt(artist.nb_fan), 'fans', '· ID', artist.id);

      // Step 2: Get top tracks
      get(DEEZER + '/artist/' + artist.id + '/top?limit=10', function(err2, trackData) {
        var tracks = (trackData && trackData.data) ? trackData.data : [];
        console.log('[Muse Live] Tracks:', tracks.length);

        // Step 3: Update based on page
        var path = window.location.pathname;
        if (path.indexOf('/dashboard') > -1 || path === '/' || path === '/22/' || path === '/22') {
          updateDashboard(artist, tracks);
        } else if (path.indexOf('/catalogue') > -1) {
          updateCatalogue(artist, tracks);
        } else if (path.indexOf('/marketing') > -1) {
          updateMarketing(artist);
        } else if (path.indexOf('/visuals') > -1) {
          updateVisuals(artist);
        }

        // Always update sidebar
        updateSidebar(artist, artist.picture_medium);

        // Also try Spotify for additional data (non-blocking)
        trySpotify(artist, tracks);

        console.log('[Muse Live] Done.');
      });
    });
  }

  function trySpotify(artist, tracks) {
    spotifyAPI('search?q=' + encodeURIComponent(ARTIST_NAME) + '&type=artist&limit=1', function(err, data) {
      if (err || !data.artists || !data.artists.items.length) return;
      var sa = data.artists.items[0];
      console.log('[Muse] Spotify bonus:', sa.name, '· popularity', sa.popularity);

      // Update followers with Spotify data if available
      if (sa.followers && sa.followers.total > 0) {
        var cards = document.querySelectorAll('[class*="rounded-2xl"].p-5');
        if (cards[1]) {
          var m = cards[1].querySelector('.text-3xl');
          if (m) m.textContent = fmt(sa.followers.total);
        }
      }

      // Use Spotify avatar (better quality)
      if (sa.images && sa.images.length > 0) {
        var avatar = document.querySelector('aside .bg-gradient-to-br');
        if (avatar) {
          avatar.style.backgroundImage = 'url(' + sa.images[0].url + ')';
          avatar.style.backgroundSize = 'cover';
          avatar.style.backgroundPosition = 'center';
          avatar.innerHTML = '';
        }
      }
    });
  }

  // Run
  setTimeout(load, 1200);
  setTimeout(load, 3500);

  window.addEventListener('pageshow', function(e) {
    if (e.persisted) setTimeout(load, 600);
  });
})();

// Mobile navigation for Muse
(function() {
  'use strict';

  function init() {
    var isMobile = window.innerWidth < 769;
    if (!isMobile) return;

    var path = window.location.pathname;

    // Determine active page
    function isActive(page) {
      return path.indexOf('/' + page) !== -1;
    }

    // Create bottom nav
    var bottomNav = document.createElement('nav');
    bottomNav.className = 'muse-mobile-nav';
    bottomNav.innerHTML =
      '<a href="/22/dashboard/"' + (isActive('dashboard') ? ' class="active"' : '') + '>' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 3v16a2 2 0 0 0 2 2h16"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path>' +
        '</svg>Streams</a>' +
      '<a href="/22/catalogue/"' + (isActive('catalogue') ? ' class="active"' : '') + '>' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<circle cx="8" cy="18" r="4"></circle><path d="M12 18V2l7 4"></path>' +
        '</svg>Catalogue</a>' +
      '<a href="/22/marketing/"' + (isActive('marketing') ? ' class="active"' : '') + '>' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M16 7h6v6"></path><path d="m22 7-8.5 8.5-5-5L2 17"></path>' +
        '</svg>Marketing</a>' +
      '<a href="/22/visuals/"' + (isActive('visuals') ? ' class="active"' : '') + '>' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"></path><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>' +
        '</svg>Visuals</a>';
    document.body.appendChild(bottomNav);

    // Create hamburger button
    var hamburger = document.createElement('button');
    hamburger.className = 'muse-hamburger';
    hamburger.setAttribute('aria-label', 'Menu');
    hamburger.innerHTML = '<span></span>';

    // Create sidebar overlay and panel
    var overlay = document.createElement('div');
    overlay.className = 'muse-mobile-sidebar-overlay';

    var sidePanel = document.createElement('div');
    sidePanel.className = 'muse-mobile-sidebar-panel';

    // Clone sidebar content
    var sidebar = document.querySelector('aside');
    if (sidebar) {
      var clone = sidebar.cloneNode(true);
      clone.style.display = 'block';
      clone.style.width = '100%';
      clone.style.height = '100%';
      clone.style.borderRight = 'none';
      clone.style.position = 'static';
      sidePanel.appendChild(clone);
    }

    document.body.appendChild(overlay);
    document.body.appendChild(sidePanel);

    // Insert hamburger into main content area header
    function insertHamburger() {
      var mainEl = document.querySelector('main');
      if (!mainEl) return;
      var headerArea = mainEl.querySelector('.flex.items-center.justify-between');
      if (!headerArea) {
        headerArea = mainEl.querySelector('div:first-child > div:first-child');
      }
      if (headerArea) {
        headerArea.style.display = 'flex';
        headerArea.style.alignItems = 'center';
        headerArea.style.gap = '0.5rem';
        // Insert hamburger before the first child or as first child
        var titleDiv = headerArea.querySelector('div:first-child');
        if (titleDiv && !headerArea.contains(hamburger)) {
          headerArea.insertBefore(hamburger, titleDiv);
        } else if (!headerArea.contains(hamburger)) {
          headerArea.insertBefore(hamburger, headerArea.firstChild);
        }
      }
    }

    // Toggle sidebar
    function openSidebar() {
      overlay.classList.add('open');
      sidePanel.classList.add('open');
    }
    function closeSidebar() {
      overlay.classList.remove('open');
      sidePanel.classList.remove('open');
    }

    hamburger.addEventListener('click', function(e) {
      e.stopPropagation();
      openSidebar();
    });

    overlay.addEventListener('click', closeSidebar);

    // Close sidebar on navigation
    sidePanel.addEventListener('click', function(e) {
      var link = e.target.closest('a');
      if (link && link.getAttribute('href')) {
        setTimeout(closeSidebar, 100);
      }
    });

    // Run insert after React renders
    setTimeout(insertHamburger, 300);
    setTimeout(insertHamburger, 1000);
    setTimeout(insertHamburger, 2000);

    // Also observe DOM changes
    if (window.MutationObserver) {
      var observer = new MutationObserver(function() {
        insertHamburger();
      });
      var mainEl = document.querySelector('main');
      if (mainEl) {
        observer.observe(mainEl, { childList: true, subtree: true });
      }
    }
  }

  // Run after initial page load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(init, 500);
    });
  } else {
    setTimeout(init, 500);
  }

  // Handle resize
  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      var mobileNav = document.querySelector('.muse-mobile-nav');
      if (window.innerWidth < 769 && !mobileNav) {
        init();
      }
    }, 250);
  });
})();

</script>
