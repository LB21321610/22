<script>// Interactive animations for Muse
(function() {
  'use strict';

  function init() {
    // 1. Ripple effect on all interactive elements
    document.addEventListener('click', function(e) {
      var target = e.target.closest('button, a, [class*="cursor-pointer"], [class*="hover:"]');
      if (!target) return;

      // Skip if target already has a ripple processing
      if (target.dataset.rippleProcessing) return;
      target.dataset.rippleProcessing = '1';

      // Add ripple container class if not present
      if (!target.classList.contains('ripple')) {
        target.classList.add('ripple');
      }

      var rect = target.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height);
      var x = e.clientX - rect.left - size / 2;
      var y = e.clientY - rect.top - size / 2;

      var ripple = document.createElement('span');
      ripple.className = 'ripple-effect';
      ripple.style.width = size + 'px';
      ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';

      target.appendChild(ripple);

      ripple.addEventListener('animationend', function() {
        ripple.remove();
        delete target.dataset.rippleProcessing;
      });
    });

    // 2. Page enter animation
    var mainEl = document.querySelector('main > div');
    if (mainEl) {
      mainEl.classList.add('muse-page-enter');
    }

    // 3. Stagger fade-in for cards and list items
    function applyStagger() {
      var items = document.querySelectorAll(
        '[class*="grid"] > [class*="rounded-2xl"]:not(.muse-mobile-nav), ' +
        '.space-y-1 > [class*="rounded-xl"]'
      );
      items.forEach(function(item, i) {
        if (item.classList.contains('fade-up-item')) return;
        item.classList.add('fade-up-item');
        item.style.animationDelay = (i * 0.06) + 's';
      });
    }
    setTimeout(applyStagger, 400);
    setTimeout(applyStagger, 1200);

    // 4. Stat card glow on first load
    var statCards = document.querySelectorAll('[class*="rounded-2xl"].p-5.flex.flex-col.gap-4');
    statCards.forEach(function(card, i) {
      card.classList.add('stat-card-glow');
      card.style.animationDelay = (i * 0.5) + 's';
    });

    // 5. Hover lift on cards
    var cards = document.querySelectorAll(
      'main [class*="rounded-2xl"][class*="hover:border"]'
    );
    cards.forEach(function(card) {
      card.classList.add('hover-lift');
    });

    // 6. Number counter animation on visible stat numbers
    function animateCounters() {
      var statNumbers = document.querySelectorAll('.text-3xl.font-bold');
      statNumbers.forEach(function(el) {
        if (el.dataset.counted) return;
        el.dataset.counted = '1';
        el.classList.add('count-animate');
      });
    }
    setTimeout(animateCounters, 600);

    // 7. Progress bar fill on visible
    function animateProgressBars() {
      var bars = document.querySelectorAll('[class*="bg-violet-500\\/70"]');
      bars.forEach(function(bar) {
        bar.style.animation = 'none';
        bar.offsetHeight; // force reflow
        bar.style.animation = 'barFill 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
      });
    }
    setTimeout(animateProgressBars, 500);

    // 8. Reveal on scroll using IntersectionObserver
    if ('IntersectionObserver' in window) {
      var revealObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      setTimeout(function() {
        var revealItems = document.querySelectorAll('[class*="rounded-2xl"]');
        revealItems.forEach(function(item) {
          item.classList.add('reveal-on-scroll');
          revealObserver.observe(item);
        });
      }, 300);
    }

    // 9. Active tab animation helper
    var tabContainers = document.querySelectorAll('[class*="rounded-xl"].p-1.flex.gap-1, .grid.grid-cols-3.gap-2');
    tabContainers.forEach(function(container) {
      container.addEventListener('click', function(e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        // Brief pulse on selection
        btn.style.transform = 'scale(0.94)';
        setTimeout(function() {
          btn.style.transform = '';
        }, 150);
      });
    });

    // 10. Sidebar nav item hover sound effect (visual only)
    var sidebarLinks = document.querySelectorAll('aside a, aside button');
    sidebarLinks.forEach(function(link) {
      link.addEventListener('mouseenter', function() {
        link.style.transform = 'translateX(2px)';
      });
      link.addEventListener('mouseleave', function() {
        link.style.transform = '';
      });
    });
  }

  // Run on load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(init, 200);
    });
  } else {
    setTimeout(init, 200);
  }

  // Re-run on SPA navigation (for the router bypass full page loads)
  window.addEventListener('pageshow', function(e) {
    if (e.persisted) {
      // Page loaded from bfcache, re-init animations
      setTimeout(init, 100);
    }
  });
})();
</script>
<script>
// ============================================================
// Muse Live Data System
// Real music data from Last.fm + Spotify APIs
// ============================================================
// Register your keys:
//   Last.fm: https://www.last.fm/api/account/create
//   Spotify: https://developer.spotify.com/dashboard (create App)
// ============================================================
(function() {
  'use strict';

  // ===== CONFIGURATION - Replace with your keys =====
  var CONFIG = {
    lastfmKey: 'YOUR_LASTFM_API_KEY',
    spotifyId: 'YOUR_SPOTIFY_CLIENT_ID',
    spotifySecret: 'YOUR_SPOTIFY_CLIENT_SECRET',
    artistName: 'The Weeknd'
  };

  // ===== API Clients =====

  // Last.fm API
  function lastfm(method, params, cb) {
    params = params || {};
    params.method = method;
    params.api_key = CONFIG.lastfmKey;
    params.format = 'json';
    var qs = Object.keys(params).map(function(k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    fetch('https://ws.audioscrobbler.com/2.0/?' + qs)
      .then(function(r) { return r.json(); })
      .then(function(d) { cb(null, d); })
      .catch(function(e) { cb(e); });
  }

  // Spotify API
  var spotifyToken = null;
  function spotifyAuth(cb) {
    if (spotifyToken) { cb(null, spotifyToken); return; }
    if (!CONFIG.spotifyId || CONFIG.spotifyId.indexOf('YOUR_') === 0) {
      cb(new Error('Spotify not configured')); return;
    }
    var body = 'grant_type=client_credentials';
    fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        'Authorization': 'Basic ' + btoa(CONFIG.spotifyId + ':' + CONFIG.spotifySecret)
      },
      body: body
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      spotifyToken = d.access_token;
      cb(null, spotifyToken);
    })
    .catch(function(e) { cb(e); });
  }

  function spotify(path, cb) {
    spotifyAuth(function(err, token) {
      if (err) { cb(err); return; }
      fetch('https://api.spotify.com/v1/' + path, {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(function(r) { return r.json(); })
      .then(function(d) { cb(null, d); })
      .catch(function(e) { cb(e); });
    });
  }

  // ===== Utilities =====
  function fmt(n) {
    if (n >= 1000000000) return (n / 1000000000).toFixed(1) + 'B';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return Math.floor(n).toLocaleString();
  }

  function findText(sel, text) {
    var els = document.querySelectorAll(sel);
    for (var i = 0; i < els.length; i++) {
      if (els[i].textContent.trim().indexOf(text) > -1) return els[i];
    }
    return null;
  }

  // ===== DOM Updaters =====

  function updateSidebar(artist, spotifyArtist) {
    // Avatar
    var avatar = document.querySelector('aside .bg-gradient-to-br');
    var img = (spotifyArtist && spotifyArtist.images && spotifyArtist.images.length > 0)
      ? spotifyArtist.images[0].url
      : (artist.image && artist.image[3] ? artist.image[3]['#text'] : null);
    if (avatar && img) {
      avatar.style.backgroundImage = 'url(' + img + ')';
      avatar.style.backgroundSize = 'cover';
      avatar.style.backgroundPosition = 'center';
      avatar.innerHTML = '';
    }

    // Name
    var nameEl = document.querySelector('aside .text-sm.font-semibold');
    if (nameEl) nameEl.textContent = artist.name.substring(0, 22);

    // Genre / followers
    var genreEl = document.querySelector('aside .text-\\[11px\\]');
    if (genreEl) {
      var genres = spotifyArtist && spotifyArtist.genres && spotifyArtist.genres.length > 0
        ? spotifyArtist.genres[0]
        : (artist.tags && artist.tags.tag && artist.tags.tag.length > 0
          ? artist.tags.tag[0].name
          : '');
      var followers = spotifyArtist && spotifyArtist.followers
        ? fmt(spotifyArtist.followers.total) + ' followers'
        : (artist.stats ? fmt(artist.stats.listeners) + ' listeners' : '');
      genreEl.textContent = genres || followers;
    }

    // Initials
    var initEl = document.querySelector('aside .text-xs.font-bold');
    if (initEl) initEl.textContent = artist.name.substring(0, 2).toUpperCase();
  }

  function updateDashboard(artist, tracks, spotifyArtist, spotifyTracks) {
    console.log('[Muse Live] Updating dashboard with real data...');

    // Page title
    var h1 = document.querySelector('main h1');
    if (h1) {
      var spotifyPop = spotifyArtist ? ' · Popularity ' + spotifyArtist.popularity + '/100' : '';
      h1.textContent = artist.name + spotifyPop;
    }

    // Welcome message
    var welcomeEl = findText('main p', 'Welcome back');
    if (welcomeEl) {
      var listeners = artist.stats ? parseInt(artist.stats.listeners).toLocaleString() : '';
      welcomeEl.textContent = 'Live data from Spotify + Last.fm' +
        (listeners ? ' · ' + listeners + ' listeners' : '');
    }

    // === Stat Cards ===
    var statCards = document.querySelectorAll('[class*="rounded-2xl"].p-5');

    // Card 1: Total Streams → Spotify popularity × playcount estimate
    if (statCards[0]) {
      var totalEl = statCards[0].querySelector('.text-3xl');
      var subEl = statCards[0].querySelector('.text-sm');
      if (totalEl && artist.stats) {
        totalEl.textContent = fmt(parseInt(artist.stats.playcount || 0));
      }
      if (subEl && spotifyArtist) {
        subEl.textContent = 'Spotify popularity: ' + spotifyArtist.popularity + '/100';
      }
    }

    // Card 2: Monthly Listeners → Last.fm listeners
    if (statCards[1]) {
      var monthlyEl = statCards[1].querySelector('.text-3xl');
      if (monthlyEl && artist.stats) {
        monthlyEl.textContent = fmt(parseInt(artist.stats.listeners || 0));
      }
    }

    // Card 3: Saves/Likes → estimated from playcount
    if (statCards[2]) {
      var savesEl = statCards[2].querySelector('.text-3xl');
      if (savesEl && artist.stats) {
        var saves = Math.floor(parseInt(artist.stats.playcount || 0) * 0.014);
        savesEl.textContent = fmt(saves);
      }
    }

    // Card 4: Playlist Adds → spotify followers / 50
    if (statCards[3]) {
      var addsEl = statCards[3].querySelector('.text-3xl');
      if (addsEl && spotifyArtist && spotifyArtist.followers) {
        addsEl.textContent = fmt(Math.floor(spotifyArtist.followers.total / 50));
      }
    }

    // === Top Tracks ===
    if (tracks.length > 0) {
      var trackRows = document.querySelectorAll('.space-y-1 > div[class*="rounded-xl"]');
      var maxPlaycount = tracks[0].playcount ? parseInt(tracks[0].playcount) : 1;

      tracks.forEach(function(track, i) {
        if (i >= trackRows.length) return;
        var row = trackRows[i];
        var nameEl = row.querySelector('.text-sm.font-medium');
        var detailEl = row.querySelector('.text-xs.text-slate-500');
        var streamsEl = row.querySelector('.text-sm.font-semibold');
        var barEl = row.querySelector('[class*="bg-violet-500\\/70"]');
        var artEl = row.querySelector('.w-10.h-10');
        var rankEl = row.querySelector('.font-mono');

        if (nameEl) nameEl.textContent = track.name.substring(0, 30);
        if (streamsEl && track.playcount) {
          streamsEl.textContent = fmt(parseInt(track.playcount));
        }
        if (barEl && track.playcount) {
          barEl.style.width = Math.max(3, (parseInt(track.playcount) / maxPlaycount * 100)) + '%';
        }
        if (rankEl) rankEl.textContent = i + 1;

        // Spotify track details if available
        if (detailEl) {
          var spotifyTrack = spotifyTracks && spotifyTracks[i];
          var parts = [];
          if (track.artist && track.artist.name) parts.push(track.artist.name);
          if (spotifyTrack) {
            if (spotifyTrack.album) parts.push(spotifyTrack.album.name.substring(0, 15));
            if (spotifyTrack.duration_ms) {
              var d = Math.floor(spotifyTrack.duration_ms / 1000);
              parts.push(Math.floor(d/60) + ':' + String(d%60).padStart(2,'0'));
            }
          }
          detailEl.textContent = parts.join(' · ');
        }

        // Album art from Spotify
        if (artEl && spotifyTrack && spotifyTrack.album && spotifyTrack.album.images) {
          artEl.style.backgroundImage = 'url(' + spotifyTrack.album.images[0].url + ')';
          artEl.style.backgroundSize = 'cover';
          artEl.innerHTML = '';
        }
      });

      // Update track list title
      var topTitle = findText('main h2', 'Top Tracks');
      if (topTitle) topTitle.textContent = artist.name + ' · Top Tracks';
    }

    // === Platform breakdown (estimated from Spotify) ===
    if (spotifyArtist && spotifyArtist.popularity) {
      var platformRows = document.querySelectorAll('[class*="rounded-2xl"] .space-y-2 > div');
      var pop = spotifyArtist.popularity;
      // Estimate platform shares based on popularity
      var shares = [
        { name: 'Spotify', pct: Math.min(65, 35 + pop * 0.4) },
        { name: 'Apple Music', pct: Math.min(40, 15 + pop * 0.25) },
        { name: 'YouTube Music', pct: Math.min(25, 10 + pop * 0.15) },
        { name: 'Amazon Music', pct: Math.min(15, 5 + pop * 0.1) },
        { name: 'Tidal', pct: Math.min(10, 2 + pop * 0.06) }
      ];
      var total = shares.reduce(function(s, x) { return s + x.pct; }, 0);
      platformRows.forEach(function(row, i) {
        if (i >= shares.length) return;
        var share = Math.round(shares[i].pct / total * 100);
        var nameEl = row.querySelector('.text-slate-400');
        var valEl = row.querySelector('.font-medium');
        if (nameEl) nameEl.textContent = shares[i].name;
        if (valEl) valEl.textContent = share + '%';
      });
    }

    // Mark as live
    var liveIndicator = document.querySelector('.animate-pulse');
    if (liveIndicator) {
      liveIndicator.parentElement.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400" style="animation: none; box-shadow: 0 0 6px #00d294;"></span>' +
        '<span style="font-size:13px;color:#5ee9b5;">Live · Last.fm + Spotify</span>';
    }
  }

  function updateCatalogue(artist, tracks, spotifyTracks) {
    var h1 = document.querySelector('main h1');
    if (h1) h1.textContent = artist.name + ' · Catalogue';

    var subEl = findText('main p', 'released');
    if (subEl) subEl.textContent = tracks.length + ' tracks · Live data';

    var cards = document.querySelectorAll('main .grid > [class*="rounded-2xl"]');

    tracks.forEach(function(track, i) {
      if (i >= cards.length - 1) return; // skip add button
      var card = cards[i];
      var nameEl = card.querySelector('.font-semibold');
      var genreEl = card.querySelector('.text-xs.text-slate-500');
      var artEl = card.querySelector('.w-16.h-16');
      var streamsEl = card.querySelector('.text-violet-300');
      var durEl = card.querySelector('.grid-cols-3 > div:first-child span:last-child');
      var bpmEl = card.querySelector('.grid-cols-3 > div:nth-child(2) span:last-child');
      var keyEl = card.querySelector('.grid-cols-3 > div:nth-child(3) span:last-child');
      var dateEl = card.querySelectorAll('.text-xs.-mt-1 .text-slate-400');

      if (nameEl) nameEl.textContent = track.name.substring(0, 25);
      if (genreEl) genreEl.textContent = artist.name;
      if (streamsEl && track.playcount) streamsEl.textContent = fmt(parseInt(track.playcount));

      // Spotify track details
      var st = spotifyTracks && spotifyTracks[i];
      if (artEl && st && st.album && st.album.images && st.album.images[1]) {
        artEl.style.backgroundImage = 'url(' + st.album.images[1].url + ')';
        artEl.style.backgroundSize = 'cover';
        artEl.innerHTML = '';
      }
      if (durEl && st && st.duration_ms) {
        var sec = Math.floor(st.duration_ms / 1000);
        durEl.textContent = Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
      }
      if (st && st.popularity) {
        if (bpmEl) bpmEl.textContent = st.popularity + ' pop';
      }
      if (st && st.album && st.album.release_date && dateEl && dateEl.length > 0) {
        dateEl[dateEl.length - 1].textContent = st.album.release_date;
      }
    });
  }

  function updateMarketing(artist, spotifyArtist) {
    var h1 = document.querySelector('main h1');
    if (h1) h1.textContent = artist.name + ' · Marketing Plan';

    var subEl = findText('main p', 'Generate');
    if (subEl) {
      var followers = spotifyArtist && spotifyArtist.followers
        ? fmt(spotifyArtist.followers.total)
        : '';
      subEl.textContent = 'Live strategy for ' + artist.name +
        (followers ? ' · ' + followers + ' followers' : '');
    }
  }

  function updateVisuals(artist, spotifyArtist) {
    var h1 = document.querySelector('main h1');
    if (h1) h1.textContent = artist.name + ' · Visuals';

    // Update text inputs
    var inputs = document.querySelectorAll('main input[type="text"]');
    if (inputs.length >= 1 && inputs[0].value === 'Nova Eclipse') {
      inputs[0].value = artist.name.substring(0, 22);
    }
    if (inputs.length >= 2 && inputs[1].value === 'Midnight Signal') {
      // Keep default or use top track name
    }

    var subEl = findText('main p', 'Create artwork');
    if (subEl) subEl.textContent = 'Promo visuals for ' + artist.name;
  }

  // ===== Main fetch orchestrator =====
  function fetchAll() {
    var hasLastfm = CONFIG.lastfmKey && CONFIG.lastfmKey.indexOf('YOUR_') !== 0;
    var hasSpotify = CONFIG.spotifyId && CONFIG.spotifyId.indexOf('YOUR_') !== 0;

    if (!hasLastfm && !hasSpotify) {
      console.log('[Muse Live] No API keys configured.');
      console.log('[Muse Live] Register at:');
      console.log('[Muse Live]   Last.fm: https://www.last.fm/api/account/create');
      console.log('[Muse Live]   Spotify: https://developer.spotify.com/dashboard');
      return;
    }

    console.log('[Muse Live] Fetching live data... (Last.fm: ' + hasLastfm + ', Spotify: ' + hasSpotify + ')');

    // Parallel: Last.fm artist + Spotify search
    var artistData = null;
    var spotifyArtist = null;
    var spotifyId = null;
    var pending = hasLastfm ? 1 : 0;
    if (hasSpotify) pending++;

    function checkDone() {
      pending--;
      if (pending > 0) return;
      // Both done, now fetch tracks
      fetchTracks();
    }

    // Last.fm artist info
    if (hasLastfm) {
      lastfm('artist.getinfo', { artist: CONFIG.artistName }, function(err, data) {
        if (!err && data.artist) {
          artistData = data.artist;
          console.log('[Muse Live] Last.fm:', artistData.name, 'playcount:', artistData.stats.playcount);
        } else {
          console.warn('[Muse Live] Last.fm fetch failed');
        }
        checkDone();
      });
    }

    // Spotify artist search
    if (hasSpotify) {
      spotify('search?q=' + encodeURIComponent(CONFIG.artistName) + '&type=artist&limit=1', function(err, data) {
        if (!err && data.artists && data.artists.items.length > 0) {
          spotifyArtist = data.artists.items[0];
          spotifyId = spotifyArtist.id;
          console.log('[Muse Live] Spotify:', spotifyArtist.name, 'followers:', spotifyArtist.followers.total);
        } else {
          console.warn('[Muse Live] Spotify search failed');
        }
        checkDone();
      });
    }

    function fetchTracks() {
      var lastfmTracks = [];
      var spotifyTracks = [];
      var trackPending = 0;
      if (hasLastfm) trackPending++;
      if (hasSpotify && spotifyId) trackPending++;

      function trackDone() {
        trackPending--;
        if (trackPending > 0) return;
        updatePage(lastfmTracks, spotifyTracks);
      }

      if (hasLastfm) {
        lastfm('artist.gettoptracks', { artist: CONFIG.artistName, limit: 10 }, function(err, data) {
          if (!err && data.toptracks && data.toptracks.track) {
            lastfmTracks = data.toptracks.track;
          }
          trackDone();
        });
      }

      if (hasSpotify && spotifyId) {
        spotify('artists/' + spotifyId + '/top-tracks?market=US', function(err, data) {
          if (!err && data.tracks) {
            spotifyTracks = data.tracks;
          }
          trackDone();
        });
      }

      if (trackPending === 0) updatePage(lastfmTracks, spotifyTracks);
    }

    function updatePage(lastfmTracks, spotifyTracks) {
      var artist = artistData || (spotifyArtist ? { name: spotifyArtist.name, stats: {} } : { name: CONFIG.artistName, stats: {} });
      if (spotifyArtist && !artistData) {
        artist.stats = artist.stats || {};
      }

      var path = window.location.pathname;
      if (path.indexOf('/dashboard') > -1 || path === '/' || path === '/22/' || path.indexOf('index') > -1) {

      sidePanel.appendChild(clone);

    document.body.appendChild(overlay);
    document.body.appendChild(sidePanel);

    // Insert hamburger into main content area header
    function insertHamburger() {
      var mainEl = document.querySelector('main');
      if (!mainEl) return;
      var headerArea = mainEl.querySelector('.flex.items-center.justify-between');
      if (!headerArea) {
        headerArea = mainEl.querySelector('div:first-child > div:first-child');

      if (headerArea) {
        headerArea.style.display = 'flex';
        headerArea.style.alignItems = 'center';
